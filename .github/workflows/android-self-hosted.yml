name: Android self-hosted fallback

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Reviewed branch; must equal feat/desk-clock-v2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linzin-v2-dedicated-emulator-qa
  cancel-in-progress: false

jobs:
  dedicated-windows-validation:
    if: >-
      github.repository == 'NullOkami47/LinzinDeskClock' &&
      github.ref == 'refs/heads/feat/desk-clock-v2' &&
      github.actor == 'NullOkami47' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.branch == 'feat/desk-clock-v2'
    runs-on: [self-hosted, Windows, X64, linzin-v2-qa]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      TEMP: 'D:\codex-tools\linzin-android\runner-QA\tmp'
      TMP: 'D:\codex-tools\linzin-android\runner-QA\tmp'
      GRADLE_USER_HOME: 'D:\codex-tools\linzin-android\runner-QA\toolchain\gradle-user-home'
      ANDROID_USER_HOME: 'D:\codex-tools\linzin-android\runner-QA\toolchain\android-user-home'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate only the dedicated API 35 emulator
        run: ./scripts/run-self-hosted-validation.ps1 -ExpectedBranch 'feat/desk-clock-v2'
      - name: Upload bounded validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linzin-v2-self-hosted-validation
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          path: |
            .local/self-hosted-validation/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
