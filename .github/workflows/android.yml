name: Android build

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      executionTarget:
        description: 'Run on GitHub-hosted Linux or an explicitly configured dedicated Windows runner'
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      branch:
        description: 'Self-hosted only: must equal LINZIN_SELF_HOSTED_BRANCH'
        required: false
        type: string
      expected_sha:
        description: 'Self-hosted only: full 40-character SHA of the reviewed branch HEAD'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-test-lint:
    if: github.event_name != 'workflow_dispatch' || inputs.executionTarget != 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate self-hosted authorisation and result parsers
        shell: pwsh
        run: ./scripts/test-self-hosted-parser.ps1
      - name: Validate manual fallback scope and result parsers
        run: python3 -I -B scripts/verify-circleci-results.py --self-test
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0, official SDK repository index
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK 37.0 and Build Tools 36.0.0
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Record toolchain
        run: |
          java -version
          bash ./gradlew --version
          android --no-metrics --sdk="$ANDROID_HOME" sdk list
      - name: Build debug and test APKs, run JVM tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --continue
      - name: Verify the complete JVM suite and lint reports
        run: python3 -I -B scripts/verify-circleci-results.py --self-test --reports-root .
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linzin-desk-clock-debug
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/debug/*.apk

  instrumentation-api-35:
    needs: debug-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install compile SDK 37.0 and Build Tools 36.0.0
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Compose instrumentation tests on API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          channel: stable
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 shell wm size 720x1280
            adb -s emulator-5554 shell wm density 320
            adb -s emulator-5554 shell settings put system accelerometer_rotation 0
            adb -s emulator-5554 shell settings put system user_rotation 1
            adb -s emulator-5554 shell wm user-rotation lock 1
            adb -s emulator-5554 shell wm fixed-to-user-rotation enabled
            adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.googlequicksearchbox
            adb -s emulator-5554 shell am force-stop com.google.android.googlequicksearchbox
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.linzinDedicatedMediaEmulator=true --no-daemon --console=plain
            adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/verify-background-clock.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --output .local/background-clock-ci
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-api-35-reports
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/background-clock-ci/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  self-hosted-validation:
    # All authorisation checks run before a reusable workflow can queue a runner.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.executionTarget == 'self-hosted' &&
      vars.LINZIN_SELF_HOSTED_ENABLED == 'true' &&
      vars.LINZIN_SELF_HOSTED_REPOSITORY != '' &&
      vars.LINZIN_SELF_HOSTED_ACTOR != '' &&
      vars.LINZIN_SELF_HOSTED_BRANCH != '' &&
      github.repository == vars.LINZIN_SELF_HOSTED_REPOSITORY &&
      github.actor == vars.LINZIN_SELF_HOSTED_ACTOR &&
      github.triggering_actor == vars.LINZIN_SELF_HOSTED_ACTOR &&
      github.ref == format('refs/heads/{0}', vars.LINZIN_SELF_HOSTED_BRANCH) &&
      inputs.branch == vars.LINZIN_SELF_HOSTED_BRANCH &&
      inputs.expected_sha != '' &&
      inputs.expected_sha == github.sha
    uses: ./.github/workflows/android-self-hosted.yml
    with:
      branch: ${{ inputs.branch }}
      expected_sha: ${{ inputs.expected_sha }}
